<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>phcontrol</title>
  <meta name="description" content="Gestión de mantenimiento de piletas.">
  <meta name="theme-color" content="#FFFFFF" id="meta-theme">
  <meta name="color-scheme" content="light dark">
  <!-- Tema antes del primer pintado (sin parpadeo). Preferencia: "auto" | "light" | "dark" (Ajustes). -->
  <script>
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('phc-tema') || 'auto'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.getElementById('meta-theme').setAttribute('content', dark ? '#192F41' : '#FFFFFF');
    })();
  </script>
  <meta name="format-detection" content="telephone=no">

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="phcontrol">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Pantallas de inicio iOS (iPhone SE → Pro Max) -->
